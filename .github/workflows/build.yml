name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build KeySystem.dylib for iOS
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Dylib with Apple Clang
        run: |
          echo "=== Compiling KeySystem.dylib for arm64 (iOS 14+) ==="
          xcrun --sdk iphoneos clang++ -shared \
            -arch arm64 \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -std=c++17 \
            -Iimgui -I. \
            -framework UIKit \
            -framework Metal \
            -framework MetalKit \
            -framework Foundation \
            -framework QuartzCore \
            -framework Security \
            MetalOverlay.mm \
            KeySystemHook.mm \
            Network.mm \
            KeychainHelper.mm \
            imgui/imgui.cpp \
            imgui/imgui_draw.cpp \
            imgui/imgui_tables.cpp \
            imgui/imgui_widgets.cpp \
            imgui/imgui_impl_metal.mm \
            -o KeySystem.dylib

          ls -lh KeySystem.dylib

      - name: Codesign Dylib with ldid
        run: |
          brew install ldid || true
          ldid -S KeySystem.dylib || true

      - name: Upload KeySystem.dylib
        uses: actions/upload-artifact@v4
        with:
          name: KeySystem-Dylib
          path: KeySystem.dylib

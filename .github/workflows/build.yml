name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build KeySystem.dylib for iOS
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          echo "=== Installing Theos ==="
          export THEOS=~/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup iPhoneOS SDK
        run: |
          echo "=== Linking Xcode iPhoneOS SDK to Theos ==="
          mkdir -p ~/theos/sdks
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Xcode SDK Path: $SDK_PATH"
          ln -s "$SDK_PATH" ~/theos/sdks/iPhoneOS.sdk

      - name: Build Dylib with Theos
        run: |
          export THEOS=~/theos
          make clean
          make FINALPACKAGE=1

      - name: Sign Dylib with ldid
        run: |
          ~/theos/bin/ldid -S .theos/obj/KeySystem.dylib || true

      - name: Upload KeySystem.dylib
        uses: actions/upload-artifact@v4
        with:
          name: KeySystem-Dylib
          path: .theos/obj/KeySystem.dylib
